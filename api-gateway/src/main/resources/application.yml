server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOSTPORT:auth-service:8081}
          predicates:
            - Path=/api/auth/**
        - id: product-service
          uri: http://${PRODUCT_SERVICE_HOSTPORT:product-service:8082}
          predicates:
            - Path=/api/products/**, /api/products
        - id: inventory-service
          uri: http://${INVENTORY_SERVICE_HOSTPORT:inventory-service:8083}
          predicates:
            - Path=/api/inventory/**, /api/inventory
